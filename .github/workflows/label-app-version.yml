name: Label issue by app version

on:
  issues:
    types: [opened, edited]

permissions:
  issues: write

jobs:
  add-version-label:
    runs-on: ubuntu-latest

    steps:
      - name: Debug issue body
        uses: actions/github-script@v8
        with:
          script: |
            core.info("ISSUE BODY START");
            core.info(context.payload.issue.body || "");
            core.info("ISSUE BODY END");

      - name: Sync labels based on selected app version
        uses: actions/github-script@v8
        with:
          script: |
            const issue = context.payload.issue;
            const body = issue.body || "";

            const match = body.match(/### App version\s+([^\r\n]+)/i);
            if (!match) {
              core.setFailed("Could not find 'App version' in the issue body.");
              return;
            }

            const value = match[1].trim().toLowerCase();

            const managedLabels = ["version:tui", "version:gui"];
            const wantedLabels = new Set();

            if (value === "both") {
              wantedLabels.add("version:tui");
              wantedLabels.add("version:gui");
            } else if (value === "tui") {
              wantedLabels.add("version:tui");
            } else if (value === "gui") {
              wantedLabels.add("version:gui");
            } else {
              core.setFailed(`Unknown App version value: ${value}`);
              return;
            }

            const currentLabels = new Set((issue.labels || []).map(label => label.name));

            const labelsToAdd = managedLabels.filter(label => wantedLabels.has(label) && !currentLabels.has(label));
            const labelsToRemove = managedLabels.filter(label => !wantedLabels.has(label) && currentLabels.has(label));

            if (labelsToAdd.length > 0) {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                labels: labelsToAdd
              });
            }

            for (const label of labelsToRemove) {
              try {
                await github.rest.issues.removeLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issue.number,
                  name: label
                });
              } catch (error) {
                core.info(`Could not remove ${label}: ${error.message}`);
              }
            }
